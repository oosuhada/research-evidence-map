services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal_garden
      POSTGRES_USER: signal_garden
      POSTGRES_PASSWORD: signal_garden
    ports:
      - "54329:5432"
    volumes:
      - signal_garden_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_garden -d signal_garden"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  signal_garden_pgdata:
